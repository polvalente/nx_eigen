  test-macos:
    name: Test on macOS (ARM64)
    runs-on: macos-14
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        run: |
          brew install erlang elixir fftw
