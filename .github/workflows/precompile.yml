name: Precompile NIFs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    env:
      MIX_ENV: prod
      ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          elixir-version: "1.18.1"

      - name: Print OTP / NIF versions
        run: |
          erl -noshell -eval 'io:format("OTP=~s NIF=~p~n", [erlang:system_info(otp_release), erlang:system_info(nif_version)]), halt().'
          elixir -e 'IO.puts("Elixir=" <> System.version())'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfftw3-dev

      - name: Restore Eigen cache
        uses: actions/cache@v4
        with:
          path: eigen-3.4.0
          key: eigen-3.4.0

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-x86_64-otp-27.2-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-x86_64-otp-27.2-mix-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Precompile NIFs
        run: |
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          mix elixir_make.precompile

      - name: Test precompiled artifact
        env:
          MIX_ENV: test
        run: |
          rm -f priv/libnx_eigen.so

          TARBALL=$(ls ${ELIXIR_MAKE_CACHE_DIR}/*.tar.gz | head -n 1)
          echo "Testing precompiled artifact: ${TARBALL}"
          TMP_DIR=$(mktemp -d)
          tar -xzf "${TARBALL}" -C "${TMP_DIR}"
          SO_FILE=$(find "${TMP_DIR}" -name "libnx_eigen.so" -type f | head -n 1)
          if [ -z "${SO_FILE}" ]; then
            echo "ERROR: libnx_eigen.so not found in tarball"
            exit 1
          fi
          mkdir -p priv
          cp "${SO_FILE}" priv/libnx_eigen.so
          touch priv/libnx_eigen.so
          rm -rf "${TMP_DIR}"

          mix test

      - name: Upload precompiled artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
        with:
          files: cache/*.tar.gz

