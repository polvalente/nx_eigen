          restore-keys: ${{ runner.os }}-otp-27.2-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests (native build)
        run: mix test

      - name: Precompile NIFs
        run: |
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          # macOS 14 is ARM64 - will build for arm64 only (native)
          mix elixir_make.precompile

      - name: Test precompiled artifact
        env:
          MIX_ENV: test
        run: |
          rm -f priv/libnx_eigen.so

          TARBALL=$(ls ${ELIXIR_MAKE_CACHE_DIR}/*.tar.gz | head -n 1)
