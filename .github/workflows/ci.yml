name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-linux:
    name: Test on Linux (x86_64)
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        elixir: ["1.18.1"]
        otp: ["27.2"]
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfftw3-dev \
            libfftw3-3

      - name: Verify FFTW installation
        run: |
          pkg-config --exists fftw3 fftw3f || (echo "FFTW not found!" && exit 1)
          pkg-config --libs fftw3 fftw3f
          ldconfig -p | grep fftw || true

      - name: Restore Eigen cache
        uses: actions/cache@v4
        with:
          path: eigen-3.4.0
          key: eigen-3.4.0

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        env:
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
        run: mix test

  test-linux-aarch64:
    name: Test on Linux (aarch64)
    runs-on: ubuntu-22.04-arm
    strategy:
      matrix:
        elixir: ["1.18.1"]
        otp: ["27.2"]
