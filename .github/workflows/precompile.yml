name: Precompile NIFs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Linux (Docker cross-compile)
    runs-on: ubuntu-22.04
    env:
      MIX_ENV: prod
      ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cross-compilation Docker image
        run: |
          docker buildx build \
            --file Dockerfile.precompile \
            --tag nx_eigen_builder \
            --load \
            .

      - name: Restore Eigen cache
        uses: actions/cache@v4
        with:
          path: eigen-3.4.0
          key: eigen-3.4.0

      - name: Cross-compile all Linux targets in Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e MIX_ENV=prod \
            -e ELIXIR_MAKE_CACHE_DIR=/work/cache \
            nx_eigen_builder \
            bash -c "
              mix local.hex --force && \
              mix local.rebar --force && \
              mix deps.get && \
              mkdir -p cache && \
              mix elixir_make.precompile
            "

      - name: Run tests (native x86_64)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e MIX_ENV=test \
            nx_eigen_builder \
            bash -c "
              mix local.hex --force && \
              mix local.rebar --force && \
              mix deps.get && \
              mix test
            "

      - name: Upload precompiled artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: cache/*.tar.gz

  macos:
    name: macOS
    runs-on: macos-14
    env:
      MIX_ENV: prod
      ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        run: |
          brew install erlang elixir fftw
          mix local.hex --force
          mix local.rebar --force

      - name: Restore Eigen cache
        uses: actions/cache@v4
        with:
          path: eigen-3.4.0
          key: eigen-3.4.0

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests (native build)
        run: mix test

      - name: Precompile NIFs
        run: |
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          # macOS 14 is ARM64 - will build for arm64 only (native)
          mix elixir_make.precompile

      - name: Upload precompiled artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: cache/*.tar.gz

  # x86_64 macOS build on older runner
  macos-x86:
    name: macOS (x86_64)
    runs-on: macos-13
    env:
      MIX_ENV: prod
      ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        run: |
          brew install erlang elixir fftw
          mix local.hex --force
          mix local.rebar --force

      - name: Restore Eigen cache
        uses: actions/cache@v4
        with:
          path: eigen-3.4.0
          key: eigen-3.4.0

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-x86-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-x86-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests (native build)
        run: mix test

      - name: Precompile NIFs
        run: |
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          # macOS 13 is x86_64 - will build for x86_64 only (native)
          mix elixir_make.precompile

      - name: Upload precompiled artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: cache/*.tar.gz
