      - name: Test precompiled artifact
        env:
          MIX_ENV: test
        run: |
          rm -f priv/libnx_eigen.so

          TARBALL=$(ls ${ELIXIR_MAKE_CACHE_DIR}/*.tar.gz | head -n 1)
          echo "Testing precompiled artifact: ${TARBALL}"
          TMP_DIR=$(mktemp -d)
          tar -xzf "${TARBALL}" -C "${TMP_DIR}"
          SO_FILE=$(find "${TMP_DIR}" -name "libnx_eigen.so" -type f | head -n 1)
          if [ -z "${SO_FILE}" ]; then
            echo "ERROR: libnx_eigen.so not found in tarball"
            exit 1
          fi
          mkdir -p priv
          cp "${SO_FILE}" priv/libnx_eigen.so
          touch priv/libnx_eigen.so
          rm -rf "${TMP_DIR}"

          mix test

      - name: Upload precompiled artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
        with:
          files: cache/*.tar.gz

  macos:
    name: macOS
    runs-on: macos-14
    env:
      MIX_ENV: prod
      ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        run: |
          brew install erlang elixir fftw
          mix local.hex --force
          mix local.rebar --force

      - name: Restore Eigen cache
        uses: actions/cache@v4
        with:
          path: eigen-3.4.0
          key: eigen-3.4.0

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests (native build)
        run: mix test

      - name: Precompile NIFs
        run: |
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          # macOS 14 is ARM64 - will build for arm64 only (native)
          mix elixir_make.precompile

      - name: Test precompiled artifact
        env:
          MIX_ENV: test
        run: |
          rm -f priv/libnx_eigen.so

          TARBALL=$(ls ${ELIXIR_MAKE_CACHE_DIR}/*.tar.gz | head -n 1)
          echo "Testing precompiled artifact: ${TARBALL}"
          TMP_DIR=$(mktemp -d)
          tar -xzf "${TARBALL}" -C "${TMP_DIR}"
          SO_FILE=$(find "${TMP_DIR}" -name "libnx_eigen.so" -type f | head -n 1)
          if [ -z "${SO_FILE}" ]; then
            echo "ERROR: libnx_eigen.so not found in tarball"
            exit 1
          fi
          mkdir -p priv
          cp "${SO_FILE}" priv/libnx_eigen.so
          touch priv/libnx_eigen.so
          rm -rf "${TMP_DIR}"

          mix test

      - name: Upload precompiled artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
        with:
          files: cache/*.tar.gz

  # x86_64 macOS build on older runner
  macos-x86:
    name: macOS (x86_64)
    runs-on: macos-13
    env:
      MIX_ENV: prod
      ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        run: |
          brew install erlang elixir fftw
          mix local.hex --force
          mix local.rebar --force

      - name: Restore Eigen cache
        uses: actions/cache@v4
        with:
          path: eigen-3.4.0
          key: eigen-3.4.0

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-x86-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-x86-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests (native build)
        run: mix test

      - name: Precompile NIFs
        run: |
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          # macOS 13 is x86_64 - will build for x86_64 only (native)
          mix elixir_make.precompile

      - name: Test precompiled artifact
        env:
          MIX_ENV: test
        run: |
          rm -f priv/libnx_eigen.so

          TARBALL=$(ls ${ELIXIR_MAKE_CACHE_DIR}/*.tar.gz | head -n 1)
          echo "Testing precompiled artifact: ${TARBALL}"
          TMP_DIR=$(mktemp -d)
          tar -xzf "${TARBALL}" -C "${TMP_DIR}"
          SO_FILE=$(find "${TMP_DIR}" -name "libnx_eigen.so" -type f | head -n 1)
          if [ -z "${SO_FILE}" ]; then
            echo "ERROR: libnx_eigen.so not found in tarball"
            exit 1
          fi
          mkdir -p priv
          cp "${SO_FILE}" priv/libnx_eigen.so
          touch priv/libnx_eigen.so
          rm -rf "${TMP_DIR}"

          mix test

      - name: Upload precompiled artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
        with:
          files: cache/*.tar.gz
